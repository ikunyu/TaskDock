[package]
name = "taskdock"
version = "1.2.0"
description = "TaskDock local Windows workspace"
edition = "2021"
rust-version = "1.99"
publish = false

[lib]
name = "taskdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-runtime = "=2.12.2"
tauri-plugin-log = "=2.10.1"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-dialog = "=2.8.4"

log = "0.4"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "=0.41.0", features = ["bundled", "backup"] }
sha2 = "=0.10.9"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
tauri-plugin-updater = "=2.14.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
