[[permission]]
identifier="desktop-read"
description="Read desktop runtime status only"
commands.allow=["desktop_status"]
[[permission]]
identifier="desktop-settings"
description="Main window validated desktop settings, safe position reset and explicit exit"
commands.allow=["save_desktop_settings","reset_window_positions","exit_app"]
[[permission]]
identifier="desktop-widget"
description="Drag, resize or hide the caller widget only"
commands.allow=["widget_window_action","set_widget_layout"]
